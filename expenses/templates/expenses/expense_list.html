{% extends "expenses/base.html" %}
{% block title %}Мої витрати{% endblock %}

{% block content %}
<div class="flex items-center justify-between mb-4">
    <h1 class="text-2xl font-semibold">Мої витрати</h1>
    <button
        class="bg-slate-800 text-white px-4 py-2 rounded hover:bg-slate-700"
        hx-get="{% url 'expense_create' %}"
        hx-target="#expense-form-container"
        hx-swap="innerHTML">
        Додати витрату
    </button>
</div>

<div class="bg-white shadow rounded p-4 mb-4">
    <form hx-get="{% url 'expense_list' %}" hx-target="#expense-table" hx-swap="innerHTML">
        <div class="grid md:grid-cols-3 gap-4">
            <div>
                <label class="block text-sm mb-1">Від дати</label>
                <input type="date" name="date_from"
                       class="w-full border rounded px-2 py-1"
                       value="{{ request.GET.date_from }}">
            </div>
            <div>
                <label class="block text-sm mb-1">До дати</label>
                <input type="date" name="date_to"
                       class="w-full border rounded px-2 py-1"
                       value="{{ request.GET.date_to }}">
            </div>
            <div class="flex items-end">
                <button type="submit"
                        class="bg-slate-800 text-white px-4 py-2 rounded hover:bg-slate-700">
                    Фільтрувати
                </button>
            </div>
        </div>
    </form>
</div>

<div id="expense-form-container" class="mb-4"></div>

<div id="expense-table">
    {% include "expenses/partials/_expense_table.html" %}
</div>
{% endblock %}
